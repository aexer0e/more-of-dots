name: Draft Windows release

on:
  push:
    paths:
      - VERSION

permissions:
  contents: write

concurrency:
  group: draft-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and draft
    if: github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: pwsh
        run: node scripts/version.mjs release-check

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Create Python environment
        run: python -m venv .venv

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare signed release configuration
        run: npm run version:release-config

      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: More of Dots v__VERSION__
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --config build/tauri.version.conf.json

      - name: Download authorized recorder build vault
        if: vars.WOD_RECORDER_VAULT_URL != '' && vars.WOD_RECORDER_VAULT_SHA256 != ''
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wod-recorder-vault.zip'
          $vault = Join-Path $env:RUNNER_TEMP 'wod-recorder-vault'
          Invoke-WebRequest -UseBasicParsing -Uri '${{ vars.WOD_RECORDER_VAULT_URL }}' -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne '${{ vars.WOD_RECORDER_VAULT_SHA256 }}'.ToLowerInvariant()) {
            throw 'Recorder build vault failed its SHA-256 integrity check.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $vault
          "WOD_BUNDLED_VERSION_VAULT=$vault" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build recorder NSIS installer
        if: vars.WOD_RECORDER_VAULT_URL != '' && vars.WOD_RECORDER_VAULT_SHA256 != ''
        shell: pwsh
        run: |
          $env:WOD_FFMPEG_PATH = (Get-Command ffmpeg.exe -ErrorAction Stop).Source
          npm run build:recorder

      - name: Sign recorder installer and write manifest
        if: vars.WOD_RECORDER_VAULT_URL != '' && vars.WOD_RECORDER_VAULT_SHA256 != ''
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $appVersion = (Get-Content VERSION -Raw).Trim()
          $recorderVersion = (Get-Content wod_replay_server/RECORDER_VERSION -Raw).Trim()
          $installer = "recorder-dist/More.of.Dots.Recorder_${recorderVersion}_x64-setup.exe"
          # Signed with the same minisign keypair as the app bundles, so the client
          # verifies against the pubkey already embedded in tauri.conf.json.
          npx --yes tauri signer sign --private-key="$env:TAURI_SIGNING_PRIVATE_KEY" --password="$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" $installer
          if ($LASTEXITCODE -ne 0) { throw 'Signing the recorder installer failed.' }
          $url = "https://github.com/${{ github.repository }}/releases/download/v$appVersion/More.of.Dots.Recorder_${recorderVersion}_x64-setup.exe"
          ./scripts/recorder-manifest.ps1 -InstallerPath $installer -Url $url
          # The manifest is signed as well, so the client accepts nothing off the
          # network that is not covered by the release keypair.
          npx --yes tauri signer sign --private-key="$env:TAURI_SIGNING_PRIVATE_KEY" --password="$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" recorder-dist/recorder.json
          if ($LASTEXITCODE -ne 0) { throw 'Signing the recorder manifest failed.' }

      - name: Attach recorder installer to draft release
        if: vars.WOD_RECORDER_VAULT_URL != '' && vars.WOD_RECORDER_VAULT_SHA256 != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $recorderVersion = (Get-Content wod_replay_server/RECORDER_VERSION -Raw).Trim()
          gh release upload "v$version" "recorder-dist/More.of.Dots.Recorder_${recorderVersion}_x64-setup.exe#More of Dots Recorder (Windows x64)" --clobber

      - name: Carry forward the previous recorder manifest
        if: vars.WOD_RECORDER_VAULT_URL == '' || vars.WOD_RECORDER_VAULT_SHA256 == ''
        shell: pwsh
        run: |
          # The client polls recorder.json on the latest release, so every release
          # needs one even when the recorder was not rebuilt. Reuse the published
          # manifest unchanged; its URL is pinned to the tag that produced it.
          New-Item -ItemType Directory -Force -Path recorder-dist | Out-Null
          $latest = 'https://github.com/${{ github.repository }}/releases/latest/download'
          try {
            # The signature has to travel with it. A manifest published without
            # one is rejected by every client, which reads as "no recorder".
            Invoke-WebRequest -UseBasicParsing -Uri "$latest/recorder.json" -OutFile recorder-dist/recorder.json
            Invoke-WebRequest -UseBasicParsing -Uri "$latest/recorder.json.sig" -OutFile recorder-dist/recorder.json.sig
          } catch {
            Remove-Item recorder-dist/recorder.json,recorder-dist/recorder.json.sig -ErrorAction SilentlyContinue
            Write-Host 'No published recorder manifest yet; this release will not advertise a recorder.'
          }

      - name: Attach recorder manifest to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not ((Test-Path recorder-dist/recorder.json) -and (Test-Path recorder-dist/recorder.json.sig))) {
            Write-Host 'No signed recorder manifest to attach.'
            exit 0
          }
          $version = (Get-Content VERSION -Raw).Trim()
          gh release upload "v$version" "recorder-dist/recorder.json#Recorder update manifest" "recorder-dist/recorder.json.sig#Recorder update manifest signature" --clobber
