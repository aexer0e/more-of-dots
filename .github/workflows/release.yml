name: Draft Windows release

on:
  push:
    paths:
      - VERSION
  # Rebuilds the current VERSION, e.g. after a cancelled run.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and draft
    if: github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: pwsh
        run: node scripts/version.mjs release-check

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare signed release configuration
        run: npm run version:release-config

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $notes = Get-Content -LiteralPath "docs/releases/$version.md" -Raw -ErrorAction Stop
          $delimiter = [guid]::NewGuid().ToString()
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: More of Dots v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          generateReleaseNotes: false
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --config build/tauri.version.conf.json
