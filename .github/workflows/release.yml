name: Draft release

on:
  push:
    paths:
      - VERSION
  # Rebuilds the current VERSION, e.g. after a cancelled run.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-release
  cancel-in-progress: true

jobs:
  draft:
    name: Draft release
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-id: ${{ steps.draft.outputs.result }}

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release version
        run: node scripts/version.mjs release-check

      # Both platform builds upload to this one draft.
      - name: Create or reuse the draft
        id: draft
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const fs = require("node:fs");
            const version = fs.readFileSync("VERSION", "utf8").trim();
            const tag = `v${version}`;
            const body = fs.readFileSync(`docs/releases/${version}.md`, "utf8");
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const existing = releases.find((release) => release.tag_name === tag);
            if (existing) {
              if (!existing.draft) throw new Error(`${tag} is already published.`);
              return String(existing.id);
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `More of Dots ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return String(data.id);

  build:
    name: Build for ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            bundles: nsis
          # Apple silicon only; macos-latest runs on it.
          - name: macOS
            runner: macos-latest
            bundles: app,dmg
          # The oldest supported Ubuntu, so the AppImage runs on older systems too.
          - name: Linux
            runner: ubuntu-22.04
            bundles: appimage

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # OpenH264's x86 assembly; Apple silicon builds use its Arm code instead.
      - name: Install NASM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" >> $env:GITHUB_PATH

      # Tauri's WebKitGTK build dependencies, the AppImage tools, and NASM for OpenH264.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file nasm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare signed release configuration
        run: npm run version:release-config

      - name: Build and upload to the draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release-id }}
          retryAttempts: 2
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --bundles ${{ matrix.bundles }} --config build/tauri.version.conf.json
