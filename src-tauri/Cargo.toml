[package]
name = "more-of-dots"
version = "1.0.0"
description = "More of Dots local replay simulator"
authors = ["More of Dots"]
edition = "2021"
build = "build.rs"

[lib]
name = "wod_replay_desktop_lib"
# The Windows desktop executable links the Rust library directly.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
bytes = "1"
# MP4 export: H.264, AAC and the container, compiled from source on every platform.
# On x86-64 OpenH264 needs NASM at build time for its assembly; build.rs checks.
fdk-aac = "0.8"
flate2 = "1"
mp4 = "0.14"
openh264 = "0.9.9"
png = "0.17"
# Use the same TLS provider as the updater.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = "thin" 
codegen-units = 16
panic = "abort"
opt-level = "z"

# The app is built for size, but replay indexing spends its time hashing,
# inflating and decoding thumbnails; these few crates are built for speed.
[profile.release.package.sha2]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

# The video and audio encoders' C sources take their optimization level from here.
[profile.release.package.openh264-sys2]
opt-level = 3

[profile.release.package.fdk-aac-sys]
opt-level = 3
